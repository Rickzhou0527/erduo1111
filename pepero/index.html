<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>11.11 빼빼로 데이</title>
<script src="access.js"></script>
<script>if(!window.PEPERO_OK){document.documentElement.style.display='none';location.replace('../');}</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/gift.css">
<link rel="stylesheet" href="css/make.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/letter.css">
<link rel="stylesheet" href="css/eggs.css">
</head>
<body>
<div id="bg"></div>
<main>
  <!-- 1. 拆礼物 -->
  <section id="s-intro" class="scene active">
    <div class="date"><span>1</span><span>1</span>.<span>1</span><span>1</span></div>
    <div class="sub">빼빼로 데이 · 百奇节</div>
    <div class="visits" id="visits"></div>
    <div class="gift shake" id="gift">
      <div class="note" id="giftNote">不许偷看！🙈 好啦，点一下就能打开</div>
      <div class="pop" id="popBunny"><div class="bubble">呀哈！</div></div>
      <div class="lid"></div><div class="box"></div><div class="ribbon"></div>
    </div>
    <p class="hint" id="introHint">有一份礼物给 <b class="toName"></b>，点一下礼盒 🎁</p>
    <button id="toMake" class="btn hidden">打开看看 →</button>
  </section>

  <!-- 2. 做 Pepero -->
  <section id="s-make" class="scene">
    <h2>先做一根专属 Pepero 吧</h2>
    <div class="stage">
      <div class="bunny" id="makeBunny"></div>
      <div class="stick"><div class="coat" id="coat"></div></div>
    </div>
    <p class="hint" id="makeHint">① 选巧克力口味</p>
    <div class="row" id="flavors"></div>
    <div class="row" id="sprinkles"></div>
    <button id="toGame" class="btn hidden">做好啦 →</button>
  </section>

  <!-- 3. 小游戏 -->
  <section id="s-game" class="scene">
    <div class="hud"><span class="mini-stick"></span><div class="bar"><div id="barFill"></div></div><span id="score">0/11</span></div>
    <canvas id="cv"></canvas>
    <div class="big" id="bigText"></div>
    <div class="love" id="love"><span></span></div>
    <div class="overlay" id="howto">
      <div class="howto-card">
        <h3>🎮 接 Pepero 小游戏</h3>
        <div class="rule"><i>👆</i><span>手指在<b>屏幕下方左右滑动</b>，乌萨奇会跟着走</span></div>
        <div class="rule"><i><span class="mini-stick"></span></i><span>接住一根 Pepero <b>+1</b></span></div>
        <div class="rule"><i>💗</i><span>接住爱心 <b>+2</b></span></div>
        <div class="rule"><i>💌</i><span>集齐 <b>11 根</b>就能打开信</span></div>
        <p class="small">漏接了也没关系，不会扣分～</p>
        <button class="btn" id="startGame">开始！</button>
      </div>
    </div>
  </section>

  <!-- 4. 信 -->
  <section id="s-letter" class="scene">
    <div class="peek bunny" id="letterBunny"></div>
    <div class="card">
      <div class="to" id="letterTo"></div>
      <div class="msg" id="msg"></div>
      <div class="from">—— <span id="fromName"></span></div>
    </div>
    <div class="ko">빼빼로 데이 축하해 💕</div>
    <div class="row">
      <button class="btn" id="accept">收下啦 💝</button>
      <button class="btn ghost" id="replay">再玩一次</button>
    </div>
    <button class="btn ghost egg-btn" id="eggBtn">🥚 彩蛋 0/10</button>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="note-modal" id="noteModal">
  <div class="note-card">
    <div class="bunny note-bunny" id="noteBunny"></div>
    <p class="note-num" id="noteNum"></p>
    <p class="note-text" id="noteText"></p>
    <button class="btn" id="noteOk">收到 💕</button>
  </div>
</div>
<div class="wish" id="wish">现在是 11:11<br>许个愿吧 ✨</div>
<div class="book" id="book">
  <div class="book-card">
    <h3>🥚 彩蛋图鉴</h3>
    <p class="sum" id="bookSum"></p>
    <div id="bookList"></div>
    <button class="btn" id="bookClose">好的</button>
  </div>
</div>


<script type="module" src="js/main.js"></script>
</body>
</html>
