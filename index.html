<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>11.11 빼빼로 데이</title>
<style>
  :root{
    --cream:#FFF8E7; --pink:#FF8FAB; --pink2:#FFC2D1; --choco:#6B3E26;
    --biscuit:#E9B872; --ink:#4a3426; --yellow:#FFF1BF;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 0%,#FFE3EC 0%,var(--cream) 60%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Apple SD Gothic Neo","Noto Sans KR","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden; user-select:none;
  }
  #bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .float{position:absolute;bottom:-40px;font-size:20px;opacity:.55;animation:up linear infinite}
  @keyframes up{to{transform:translateY(-115vh) rotate(30deg)}}

  main{position:relative;height:100%;max-width:480px;margin:0 auto}
  /* 手机 Safari：100% 会把底部工具栏算进去，用 dvh 取实际可见高度 */
  @supports (height:100dvh){ html,body,main{height:100dvh} }
  .scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
  .scene.active{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}}

  .date{font-size:72px;font-weight:900;letter-spacing:4px;color:var(--choco);line-height:1}
  .date span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  .date span:nth-child(2){animation-delay:.1s}.date span:nth-child(4){animation-delay:.2s}.date span:nth-child(5){animation-delay:.3s}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .sub{font-size:20px;color:var(--pink);font-weight:700;margin-top:-8px}
  h2{font-size:22px;color:var(--choco)}
  .hint{font-size:16px;opacity:.85}
  .hidden{visibility:hidden}
  .visits{min-height:30px;font-size:14px;font-weight:700;opacity:0;transition:opacity .6s}
  .visits.on{opacity:1}
  .visits span{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px}

  .btn{
    border:3px solid var(--ink);background:var(--pink);color:#fff;font-size:18px;font-weight:800;
    padding:12px 28px;border-radius:999px;box-shadow:0 5px 0 var(--ink);cursor:pointer;font-family:inherit
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn.ghost{background:#fff;color:var(--ink)}

  /* gift */
  .gift{position:relative;width:190px;height:265px;cursor:pointer}
  .bunny svg,.pop svg{width:100%;height:auto;display:block}
  .gift.shake{animation:shake 1.2s ease-in-out infinite}
  @keyframes shake{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}
  .box{position:absolute;bottom:0;left:10px;width:170px;height:130px;background:var(--pink);border:4px solid var(--ink);border-radius:10px;z-index:2}
  .ribbon{position:absolute;bottom:0;left:84px;width:22px;height:130px;background:#FFE066;border-left:4px solid var(--ink);border-right:4px solid var(--ink);z-index:3}
  .lid{position:absolute;bottom:118px;left:0;width:190px;height:36px;background:#FF6F94;border:4px solid var(--ink);border-radius:10px;z-index:4;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s}
  .lid::after{content:"";position:absolute;left:80px;top:-4px;width:22px;height:36px;background:#FFE066;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
  .gift.open .lid{transform:translate(70px,-120px) rotate(35deg);opacity:0}
  .pop{position:absolute;left:30px;bottom:40px;width:130px;z-index:1;transform:translateY(60px) scale(.6);opacity:0;transition:all .6s cubic-bezier(.3,1.7,.5,1) .25s}
  .gift.open .pop{transform:translateY(-78px) scale(1);opacity:1}
  .bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 12px;font-weight:900;font-size:20px;white-space:nowrap}
  .pop .bubble{right:-52px;top:4px;transform:rotate(8deg);z-index:2}

  /* make */
  .stage{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:320px}
  .stage .bunny{width:120px;margin-bottom:10px}
  .stick{position:relative;width:24px;height:300px;background:var(--biscuit);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
  .coat{position:absolute;top:0;left:0;right:0;height:0;transition:height .9s cubic-bezier(.4,1.4,.5,1),background .3s;border-bottom:3px solid var(--ink)}
  .coat.on{height:72%}
  .sp{position:absolute;width:5px;height:9px;border-radius:3px}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{border:3px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip.sel{background:var(--yellow);box-shadow:0 0 0 3px var(--pink)}
  .chip i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--ink)}

  /* game */
  #s-game{justify-content:flex-start;padding:12px 0 0;gap:6px}
  .hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 16px;font-weight:800;font-size:18px}
  .bar{flex:1;height:16px;margin:0 12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
  .bar div{height:100%;width:0;background:var(--pink);transition:width .25s}
  canvas{flex:1;width:100%;min-height:0;touch-action:none;display:block}
  .mini-stick{display:inline-block;width:8px;height:26px;border:2px solid var(--ink);border-radius:4px;background:linear-gradient(var(--choco) 0 66%,var(--biscuit) 66%);transform:rotate(18deg)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(255,248,231,.88);z-index:5}
  .overlay.off{display:none}
  .howto-card{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px 18px;width:100%;max-width:340px;text-align:left;display:flex;flex-direction:column;gap:12px}
  .howto-card h3{text-align:center;font-size:20px;color:var(--choco)}
  .rule{display:flex;align-items:center;gap:12px;font-size:16px;line-height:1.4}
  .rule>i{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:22px;font-style:normal;background:var(--yellow);border:2px solid var(--ink);border-radius:50%}
  .small{font-size:13px;opacity:.7;text-align:center}
  .howto-card .btn{align-self:center;margin-top:4px}
  .big{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:42px;font-weight:900;color:var(--pink);-webkit-text-stroke:2px var(--ink);pointer-events:none;opacity:0;z-index:4}
  .big.show{animation:bigpop .9s ease forwards}
  @keyframes bigpop{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
  body.playing #bg{display:none}

  /* letter */
  .card{
    background:#fff;border:4px solid var(--ink);border-radius:22px;padding:22px 20px 18px;width:100%;
    box-shadow:0 8px 0 var(--ink);text-align:left;position:relative;max-height:62vh;overflow:auto
  }
  .card .to{font-weight:900;font-size:20px;margin-bottom:12px;color:var(--choco)}
  .card .msg{font-size:17px;line-height:1.8;min-height:8em;white-space:pre-wrap}
  .card .msg .cur{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .card .from{text-align:right;margin-top:14px;font-weight:800}
  .peek{width:110px;margin-bottom:-14px;z-index:2}
  .ko{font-size:22px;font-weight:900;color:var(--pink)}
  .rain{position:fixed;top:-60px;width:10px;height:56px;border-radius:5px;border:2px solid var(--ink);pointer-events:none;z-index:50;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
  .jump{animation:jump .5s ease}
  @keyframes jump{40%{transform:translateY(-22px) scale(1.05,.95)}}

  /* ===== 彩蛋 ===== */
  body{-webkit-touch-callout:none}
  img{-webkit-user-drag:none}
  .date span{cursor:pointer}
  .d-stick{display:inline-block;width:20px;height:60px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(var(--choco) 0 64%,var(--biscuit) 64%);vertical-align:-2px;margin:0 6px;animation:stickin .45s cubic-bezier(.3,1.7,.5,1)}
  @keyframes stickin{from{transform:scale(0) rotate(-90deg)}}
  .gift.pressing{animation:pressing .12s linear infinite}
  @keyframes pressing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .gift.peek .lid{transform:translate(-4px,-20px) rotate(-10deg)}
  .note{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) rotate(-3deg);background:#FFFBEA;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;white-space:nowrap;z-index:6;opacity:0;pointer-events:none;transition:opacity .3s}
  .note.on{opacity:1}
  .boing{animation:boing .6s ease;transform-origin:50% 100%}
  @keyframes boing{20%{transform:scale(.92,1.12)}45%{transform:scale(1.08,.9)}70%{transform:scale(.97,1.04)}}
  .party{animation:party 1.4s ease;transform-origin:50% 60%}
  @keyframes party{0%{transform:none}25%{transform:translateY(-30px) rotate(180deg) scale(1.1)}50%{transform:translateY(0) rotate(360deg)}70%{transform:translateY(-18px) rotate(360deg)}100%{transform:rotate(360deg)}}
  .burst{position:fixed;z-index:55;pointer-events:none;font-weight:900;font-size:20px;color:var(--pink);-webkit-text-stroke:1px var(--ink);animation:burst 1.3s ease-out forwards;white-space:nowrap}
  @keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1)}}
  .rainbow-dot{background:linear-gradient(90deg,#FF6F94,#FFE066,#A6E3A1,#7BD3EA,#C3A6FF)!important}
  .chip.new{animation:stickin .5s cubic-bezier(.3,1.7,.5,1)}
  .love{position:absolute;left:16px;right:16px;top:20%;z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
  .love.on{opacity:1}
  .love span{display:inline-block;background:#FFF6D6;border:3px solid #C99A00;border-radius:16px;padding:10px 16px;font-size:18px;font-weight:800;color:var(--choco);box-shadow:0 4px 0 #C99A00}
  .card{transition:transform .25s ease-in}
  .card.flip{transform:rotateY(90deg)}
  .card.ps{background:#FFFBEA}
  body.gold-day .date{color:#D99A00;text-shadow:0 0 14px #FFE066}
  .meteor{position:fixed;z-index:52;width:140px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,224,102,0),#FFE066 70%,#fff);pointer-events:none;transform:rotate(-30deg);animation:meteor 1.6s ease-in forwards}
  @keyframes meteor{from{opacity:1;translate:0 0}to{opacity:0;translate:-110vw 60vw}}
  .wish{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:56;background:rgba(43,29,20,.85);color:#FFE9A8;border-radius:18px;padding:16px 22px;font-size:20px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s;white-space:nowrap}
  .wish.on{opacity:1}
  .toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-140%);z-index:70;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink);transition:transform .45s cubic-bezier(.3,1.5,.5,1);white-space:nowrap;cursor:pointer;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
  .toast.on{transform:translate(-50%,0)}
  .egg-btn{font-size:15px;padding:8px 16px}
  .book{position:fixed;inset:0;z-index:60;background:rgba(74,52,38,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .book.on{display:flex}
  .book-card{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);width:100%;max-width:380px;max-height:84vh;overflow:auto;padding:18px 16px 14px;text-align:left}
  .book-card h3{text-align:center;color:var(--choco);font-size:20px}
  .book-card .sum{text-align:center;font-size:13px;opacity:.7;margin:4px 0 8px}
  .egg{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:2px dashed #EADFCF}
  .egg i{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;background:var(--yellow)}
  .egg.locked i{background:#EEE;filter:grayscale(1);opacity:.6}
  .egg b{display:block;font-size:15px}
  .egg small{display:block;font-size:13px;opacity:.7;line-height:1.4}
  .book-card .btn{display:block;margin:12px auto 2px}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <!-- 1. 拆礼物 -->
  <section id="s-intro" class="scene active">
    <div class="date"><span>1</span><span>1</span>.<span>1</span><span>1</span></div>
    <div class="sub">빼빼로 데이 · 百奇节</div>
    <div class="visits" id="visits"></div>
    <div class="gift shake" id="gift">
      <div class="note" id="giftNote">不许偷看！🙈 好啦，点一下就能打开</div>
      <div class="pop" id="popBunny"><div class="bubble">呀哈！</div></div>
      <div class="lid"></div><div class="box"></div><div class="ribbon"></div>
    </div>
    <p class="hint" id="introHint">有一份礼物给 <b class="toName"></b>，点一下礼盒 🎁</p>
    <button id="toMake" class="btn hidden">打开看看 →</button>
  </section>

  <!-- 2. 做 Pepero -->
  <section id="s-make" class="scene">
    <h2>先做一根专属 Pepero 吧</h2>
    <div class="stage">
      <div class="bunny" id="makeBunny"></div>
      <div class="stick"><div class="coat" id="coat"></div></div>
    </div>
    <p class="hint" id="makeHint">① 选巧克力口味</p>
    <div class="row" id="flavors"></div>
    <div class="row" id="sprinkles"></div>
    <button id="toGame" class="btn hidden">做好啦 →</button>
  </section>

  <!-- 3. 小游戏 -->
  <section id="s-game" class="scene">
    <div class="hud"><span class="mini-stick"></span><div class="bar"><div id="barFill"></div></div><span id="score">0/11</span></div>
    <canvas id="cv"></canvas>
    <div class="big" id="bigText"></div>
    <div class="love" id="love"><span></span></div>
    <div class="overlay" id="howto">
      <div class="howto-card">
        <h3>🎮 接 Pepero 小游戏</h3>
        <div class="rule"><i>👆</i><span>手指在<b>屏幕下方左右滑动</b>，乌萨奇会跟着走</span></div>
        <div class="rule"><i><span class="mini-stick"></span></i><span>接住一根 Pepero <b>+1</b></span></div>
        <div class="rule"><i>💗</i><span>接住爱心 <b>+2</b></span></div>
        <div class="rule"><i>💌</i><span>集齐 <b>11 根</b>就能打开信</span></div>
        <p class="small">漏接了也没关系，不会扣分～</p>
        <button class="btn" id="startGame">开始！</button>
      </div>
    </div>
  </section>

  <!-- 4. 信 -->
  <section id="s-letter" class="scene">
    <div class="peek bunny" id="letterBunny"></div>
    <div class="card">
      <div class="to">给 <span class="toName"></span>：</div>
      <div class="msg" id="msg"></div>
      <div class="from">—— <span id="fromName"></span></div>
    </div>
    <div class="ko">빼빼로 데이 축하해 💕</div>
    <div class="row">
      <button class="btn" id="accept">收下啦 💝</button>
      <button class="btn ghost" id="replay">再玩一次</button>
    </div>
    <button class="btn ghost egg-btn" id="eggBtn">🥚 彩蛋 0/10</button>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="wish" id="wish">现在是 11:11<br>许个愿吧 ✨</div>
<div class="book" id="book">
  <div class="book-card">
    <h3>🥚 彩蛋图鉴</h3>
    <p class="sum" id="bookSum"></p>
    <div id="bookList"></div>
    <button class="btn" id="bookClose">好的</button>
  </div>
</div>

<script>
/* ================== 在这里改成你的内容 ================== */
const CONFIG = {
  toName: "耳朵",               // 她的名字 / 昵称
  fromName: "我",               // 你的名字
  // 乌萨奇图片：放到同目录，填文件名（透明背景 png 最好）
  bunnyImage: "usagi.png",          // 平时的样子
  bunnyImageYaha: "usagi-yaha.png", // 兴奋喊"呀哈！"的样子（没有就留空 ""，会用上面那张）
  message: [
    "今天是 11 月 11 日，韩国的 Pepero Day。",
    "没办法亲手把 Pepero 递给你，",
    "所以做了这个小东西，里面的每一根都是送你的。",
    "希望你今天也像乌萨奇一样，",
    "元气满满，呀哈！",
  ],
  // 彩蛋 8：长按信末尾的署名，信纸翻面后显示（草稿，改成你想说的）
  ps: [
    "P.S.",
    "其实最想送你的不是这些 Pepero，",
    "是下次见面时，亲手递给你的那一盒。",
  ],
  // 彩蛋 6：接住金色 Pepero 时随机弹出一句（草稿，改成你想说的）
  loveLines: [
    "你比 Pepero 还甜 🍫",
    "今天也有在想你",
    "11.11 也想和你一起过",
    "收到这根的人，要开心一整天哦",
    "你是我心里的第一名 🏅",
  ],
  // 访问次数（按 IP 统计）：部署时由 GitHub Actions 用仓库变量 SUPABASE_URL / SUPABASE_ANON_KEY 替换
  // 本地预览时保持占位符即可（不会统计）
  supabaseUrl: "__SUPABASE_URL__",
  supabaseAnonKey: "__SUPABASE_ANON_KEY__",
};
/* ======================================================= */

const $ = s => document.querySelector(s);
const show = id => { document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); };
document.querySelectorAll('.toName').forEach(e=>e.textContent=CONFIG.toName);
$('#fromName').textContent = CONFIG.fromName;

/* ---------- 原创小兔 ---------- */
function bunnySVG(mood){
  const mouth = mood==='yaha'
    ? '<path d="M86 150 Q100 178 114 150 Z" fill="#c4475d" stroke="#4a3426" stroke-width="3.5" stroke-linejoin="round"/>'
    : '<path d="M89 150 Q94.5 158 100 150 Q105.5 158 111 150" fill="none" stroke="#4a3426" stroke-width="3.5" stroke-linecap="round"/>';
  const eyes = mood==='yaha'
    ? '<path d="M66 136 L80 140 L66 144" fill="none" stroke="#2b1d14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M134 136 L120 140 L134 144" fill="none" stroke="#2b1d14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<ellipse cx="74" cy="138" rx="7" ry="9" fill="#2b1d14"/><circle cx="76.5" cy="134.5" r="2.6" fill="#fff"/><ellipse cx="126" cy="138" rx="7" ry="9" fill="#2b1d14"/><circle cx="128.5" cy="134.5" r="2.6" fill="#fff"/>';
  return `<svg viewBox="0 0 200 222" xmlns="http://www.w3.org/2000/svg" width="200" height="222">
    <g stroke="#4a3426" stroke-width="4" fill="#FFF1BF">
      <ellipse cx="72" cy="60" rx="17" ry="52" transform="rotate(-10 72 60)"/>
      <ellipse cx="128" cy="60" rx="17" ry="52" transform="rotate(10 128 60)"/>
    </g>
    <ellipse cx="72" cy="66" rx="7" ry="34" fill="#FFC2D1" transform="rotate(-10 72 66)"/>
    <ellipse cx="128" cy="66" rx="7" ry="34" fill="#FFC2D1" transform="rotate(10 128 66)"/>
    <ellipse cx="100" cy="152" rx="76" ry="64" fill="#FFF1BF" stroke="#4a3426" stroke-width="4"/>
    ${eyes}
    <ellipse cx="58" cy="160" rx="12" ry="7" fill="#FF9EB5" opacity=".75"/>
    <ellipse cx="142" cy="160" rx="12" ry="7" fill="#FF9EB5" opacity=".75"/>
    ${mouth}
  </svg>`;
}
function bunnySrc(mood){
  return (mood==='yaha' && CONFIG.bunnyImageYaha) || CONFIG.bunnyImage || '';
}
function bunnyHTML(mood){
  const src=bunnySrc(mood);
  return src ? `<img src="${src}" style="width:100%;display:block" alt="乌萨奇">` : bunnySVG(mood);
}
function setBunny(el, mood){
  el.innerHTML = bunnyHTML(mood);
  const img=el.querySelector('img');
  if(img) img.onerror=()=>{ img.outerHTML=bunnySVG(mood); };
}

/* ---------- 3. 接 Pepero 小游戏 ---------- */
const GOAL=11;
const cv=$('#cv'), ctx=cv.getContext('2d');
let W,H,dpr, bx, items, score, last, spawnT, raf, yahaT=0, pops=[];
const imgs={};
function loadImg(mood){
  const im=new Image();
  im.onerror=()=>{ im.onerror=null; im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(bunnySVG(mood)); };
  im.src=bunnySrc(mood) || ('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(bunnySVG(mood)));
  return im;
}
imgs.happy=loadImg('happy'); imgs.yaha=loadImg('yaha');

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
// phase: howto（看规则）→ countdown（3-2-1，可以先练习拖动）→ play → done
let phase='howto', moved=false, idle=0, hintT=0, milestones={}, cdTimer;
function startGame(skipHowto){
  resize(); bx=W/2; items=[]; score=0; spawnT=0; pops=[]; moved=false; idle=0; milestones={};
  spawnCount=0; goldSeen=false; combo=0; lastCatch=0; fever=0; $('#love').classList.remove('on');
  updateHud(); document.body.classList.add('playing');
  phase='howto'; clearInterval(cdTimer);
  $('#howto').classList.toggle('off', !!skipHowto);
  last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  if(skipHowto) countdown();
}
$('#startGame').onclick=()=>{ $('#howto').classList.add('off'); countdown(); };
function bigText(txt){ const el=$('#bigText'); el.textContent=txt; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function countdown(){
  phase='countdown'; let n=3; bigText(n);
  cdTimer=setInterval(()=>{ n--; if(n>0) bigText(n); else { clearInterval(cdTimer); bigText('开始！'); phase='play'; } },800);
}
function updateHud(){ $('#score').textContent=`${score}/${GOAL}`; $('#barFill').style.width=(score/GOAL*100)+'%'; }
// 手机：相对拖动（像触控板），手指放在哪里都行，乌萨奇不会跳到手指底下被挡住
// 电脑：鼠标悬停时乌萨奇直接跟随光标
let dragX=null, dragBx=0;
const DRAG_GAIN=1.3;
function setBx(x){ bx=Math.max(40,Math.min(W-40,x)); moved=true; idle=0; }
cv.addEventListener('pointerdown',e=>{
  if(phase==='howto') return;
  dragX=e.clientX; dragBx=bx;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(phase==='howto') return;
  if(dragX!==null) setBx(dragBx+(e.clientX-dragX)*DRAG_GAIN);
  else if(e.pointerType==='mouse') setBx(e.clientX-cv.getBoundingClientRect().left);
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,()=>{ dragX=null; }));
window.addEventListener('resize',()=>{ if($('#s-game').classList.contains('active')) resize(); });

// 彩蛋 6：金色 Pepero（约 7% 概率；一局里第 10 根还没出现过的话保证出现一次）
// 彩蛋 7：连续接住 5 个、每两个之间不超过 2.5 秒 → FEVER 5 秒
let spawnCount=0, goldSeen=false, combo=0, lastCatch=0, fever=0, loveTimer;
function spawn(){
  spawnCount++;
  let gold = !goldSeen && (Math.random()<.07 || spawnCount===10);
  if(gold) goldSeen=true;
  const heart=!gold && Math.random()<.18;
  const fl = (flavor && Math.random()<.5) ? flavor : FLAVORS[Math.floor(Math.random()*FLAVORS.length)];
  const c = fl.rainbow ? fl.colors[Math.floor(Math.random()*fl.colors.length)] : fl.c;
  items.push({x:30+Math.random()*(W-60),y:-60,vy:(gold?120:140)+Math.random()*90+score*6,rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*2,heart,gold,c});
}
function drawStick(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
  ctx.lineWidth=2.5; ctx.strokeStyle='#4a3426';
  if(it.gold){ ctx.shadowColor='#FFD54A'; ctx.shadowBlur=18+Math.sin(performance.now()/120)*8; }
  rr(-6,-34,12,68,6); ctx.fillStyle=it.gold?'#FFE58A':'#E9B872'; ctx.fill(); ctx.stroke();
  rr(-7,-34,14,48,7); ctx.fillStyle=it.gold?'#F2B705':it.c; ctx.fill(); ctx.stroke();
  ctx.restore();
}
function showLove(){
  const lines=CONFIG.loveLines||[]; if(!lines.length) return;
  $('#love span').textContent=lines[Math.floor(Math.random()*lines.length)];
  $('#love').classList.add('on'); clearTimeout(loveTimer);
  loveTimer=setTimeout(()=>$('#love').classList.remove('on'),2400);
}
function drawHeart(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💗',0,0); ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function loop(t){
  if(!$('#s-game').classList.contains('active')) return;
  const dt=Math.min((t-last)/1000,.05); last=t;
  ctx.clearRect(0,0,W,H);
  if(fever>0) fever-=dt;
  if(phase==='play'){ spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=(.55+Math.random()*.45)*(fever>0?.45:1); } }
  const ref=imgs.happy, ratio=(ref.naturalWidth&&ref.naturalHeight)?ref.naturalHeight/ref.naturalWidth:1.11;
  // 底部留出手指滑动区，乌萨奇站在滑动区上方
  const zone=Math.max(110,Math.min(160,H*.22));
  const bw=96, bh=bw*ratio, by=H-zone-bh;
  const zx=16, zy=H-zone+14, zw=W-32, zh=zone-28;
  ctx.fillStyle='rgba(255,143,171,.13)'; rr(zx,zy,zw,zh,24); ctx.fill();
  ctx.setLineDash([7,6]); ctx.strokeStyle='rgba(74,52,38,.35)'; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(74,52,38,.6)'; ctx.font='700 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👆 手指在这里左右滑动',W/2,zy+zh/2); ctx.textBaseline='alphabetic';
  for(const it of items){
    it.y+=it.vy*dt; it.rot+=it.vr*dt;
    if(!it.done && it.y>by+20 && it.y<by+80 && Math.abs(it.x-bx)<bw*.55){
      it.done=true; score=Math.min(GOAL,score+(it.gold?3:it.heart?2:1)); yahaT=.35; updateHud();
      pops.push({x:bx,y:by,t:0,txt:it.gold?'+3 ✨':it.heart?'+2 💕':['呀哈！','乌拉！','哈！'][Math.floor(Math.random()*3)]});
      const now=performance.now();
      combo = now-lastCatch<2500 ? combo+1 : 1; lastCatch=now;
      if(it.gold){ showLove(); unlock('gold'); }
      if(combo>=5 && fever<=0 && score<GOAL){ fever=5; combo=0; bigText('🔥 FEVER！'); unlock('fever'); }
      else if(score<GOAL){
        if(!milestones.first){ milestones.first=1; bigText('接到啦！'); }
        else if(score>=6 && !milestones.half){ milestones.half=1; bigText('过半啦！'); }
        else if(score===GOAL-1 && !milestones.last){ milestones.last=1; bigText('还差 1 根！'); }
      }
    }
  }
  items=items.filter(it=>!it.done && it.y<H+80);
  items.forEach(it=>it.heart?drawHeart(it):drawStick(it));

  yahaT-=dt;
  const im=yahaT>0?imgs.yaha:imgs.happy;
  const hop=yahaT>0?Math.sin((.35-yahaT)/.35*Math.PI)*14:0;
  if(fever>0){ ctx.save(); ctx.shadowColor='#FFB300'; ctx.shadowBlur=30+Math.sin(performance.now()/90)*10; }
  if(im.complete) ctx.drawImage(im,bx-bw/2,by-hop,bw,bh);
  if(fever>0) ctx.restore();

  // 拖动提示：还没滑动过，或者停下超过 4 秒
  if(phase==='play') idle+=dt;
  if(phase!=='howto' && phase!=='done' && (!moved || idle>4)){
    hintT+=dt; const off=Math.abs(Math.sin(hintT*4))*10;
    const label='手指在下面左右滑动 👇', ty=by-hop-30;
    ctx.font='800 15px sans-serif'; const tw=ctx.measureText(label).width;
    const lx=Math.max(tw/2+18,Math.min(W-tw/2-18,bx));
    ctx.fillStyle='#fff'; ctx.strokeStyle='#4a3426'; ctx.lineWidth=2.5;
    rr(lx-tw/2-12,ty-15,tw+24,30,15); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#4a3426'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,lx,ty);
    ctx.font='28px sans-serif';
    ctx.fillText('👈',bx-bw/2-20-off,by+bh*.45); ctx.fillText('👉',bx+bw/2+20+off,by+bh*.45);
    ctx.textBaseline='alphabetic';
  }

  ctx.textAlign='center'; ctx.font='900 20px sans-serif';
  pops.forEach(p=>{ p.t+=dt; ctx.globalAlpha=Math.max(0,1-p.t); ctx.fillStyle='#FF6F94'; ctx.fillText(p.txt,p.x,p.y-20-p.t*50); });
  ctx.globalAlpha=1; pops=pops.filter(p=>p.t<1);

  if(score>=GOAL && phase==='play'){
    phase='done'; bigText('🎉 集齐 11 根！');
    setTimeout(()=>{ document.body.classList.remove('playing'); show('#s-letter'); typeLetter(); },1400);
  }
  raf=requestAnimationFrame(loop);
}

/* ---------- 4. 信 ---------- */
let typing;
function typeLetter(){
  clearInterval(typing);
  if(psShown){ psShown=false; $('.card').classList.remove('ps'); $('.card .to').innerHTML=`给 <span class="toName">${escapeHTML(CONFIG.toName)}</span>：`; }
  const full=CONFIG.message.join('\n'); const el=$('#msg'); let i=0;
  setBunny($('#letterBunny'),'happy');
  typing=setInterval(()=>{
    i++; el.innerHTML=escapeHTML(full.slice(0,i))+'<span class="cur"></span>';
    if(i>=full.length){ clearInterval(typing); setBunny($('#letterBunny'),'yaha'); }
  },90);
}
function escapeHTML(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
$('#accept').onclick=()=>{ peperoRain(60); replayAnim($('#letterBunny'),'jump'); };

// 彩蛋 8：长按署名，信纸翻到背面看 P.S.；点一下信纸翻回来
let psShown=false;
function flipCard(toPS){
  const card=$('.card'); card.classList.add('flip');
  setTimeout(()=>{
    clearInterval(typing);
    psShown=toPS; card.classList.toggle('ps',toPS);
    $('.card .to').innerHTML = toPS ? '（背面）' : `给 <span class="toName">${escapeHTML(CONFIG.toName)}</span>：`;
    $('#msg').innerHTML = escapeHTML((toPS?CONFIG.ps:CONFIG.message).join('\n'));
    card.classList.remove('flip');
  },250);
}
onLongPress($('.card .from'),900,()=>{ if(!psShown){ flipCard(true); unlock('ps'); } });
$('.card').addEventListener('click',()=>{ if(psShown) flipCard(false); });
$('#replay').onclick=()=>{ show('#s-game'); startGame(true); };
</script>
