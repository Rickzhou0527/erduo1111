name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.webp"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp index.html _site/
          shopt -s nullglob
          for f in *.png *.jpg *.jpeg *.gif *.webp; do cp "$f" _site/; done

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY 仓库变量未设置，访问次数统计将不会启用"
          fi

          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("__SUPABASE_URL__", os.environ.get("SUPABASE_URL", "").rstrip("/"))
          s = s.replace("__SUPABASE_ANON_KEY__", os.environ.get("SUPABASE_ANON_KEY", ""))
          p.write_text(s, encoding="utf-8")
          PY

          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
