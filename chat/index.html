<meta name="theme-color" content="#1c120d" media="(prefers-color-scheme: dark)" id="tcDark">
<script id="theme-init">(function(){try{var t=localStorage.getItem('chat.theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);var c=t==='dark'?'#1c120d':'#f4e3c8';document.getElementById('tcLight').content=c;document.getElementById('tcDark').content=c}}catch(e){}})()</script>

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--page);color:var(--t1);
    font-family:"DM Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:var(--fs-md);font-weight:400;line-height:1.5;
    -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;
  }
  input,textarea,button{font:inherit;color:inherit}
  ::placeholder{color:var(--t3);opacity:1}
  ::selection{background:rgba(238,136,166,.4)}
  *{scrollbar-color:var(--hair) transparent}
  input,textarea{-webkit-user-select:text;user-select:text;font-size:var(--fs-md)}
  button{cursor:pointer;background:none;border:0}
  [hidden]{display:none!important}
  img{-webkit-user-drag:none}
  :focus-visible{outline:2px solid var(--pink-text);outline-offset:2px}
  .i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

  /* 玻璃：每块玻璃都有厚度（顶缘高光、底缘暗边、侧缘折光）和层级阴影 */
  .glass,.top,#tabbar,#composer,#emojiPanel,#plusPanel,.panel,.card,.auth-card{
    background:var(--g-card);border:1px solid var(--rim);
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),inset 1px 0 0 var(--side),inset -1px 0 0 var(--side),var(--sh-1);
  }
  .top,#tabbar,#composer,#emojiPanel,#plusPanel{background:var(--g-bar);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),inset 1px 0 0 var(--side),inset -1px 0 0 var(--side),var(--sh-2)}
  .top,#tabbar,#composer,#emojiPanel,#plusPanel,.panel,#view-friends .card,.auth-card{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

  /* 外壳：手机全屏，桌面居中 480px；背景是窗外的光（--scene-bg，可以换成真正的插画：设置 --scene-img:url(...)） */
  #shell{
    position:fixed;top:0;left:50%;width:100%;max-width:480px;height:100vh;height:100dvh;
    transform:translateX(-50%);overflow:hidden;
    display:flex;flex-direction:column;
    background:var(--scene-bg);background-size:cover;background-position:center;
  }
  @media (min-width:481px){ #shell{box-shadow:0 0 0 1px var(--hair),0 0 48px rgba(0,0,0,.2)} }
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .center{align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}

  /* 通用小零件 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:8px 20px;min-height:44px;font-weight:500;font-size:var(--fs-md);
    background-color:var(--pink);color:var(--on-pink);border:1px solid rgba(0,0,0,.08);border-radius:var(--r-ctl);
    background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0) 60%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.14),0 1px 2px rgba(24,14,6,.14),0 4px 10px rgba(24,14,6,.12);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease),background-color .16s var(--ease);
  }
  .btn:active:not(:disabled),.icon-btn:active,#fxRow button:active,.card[role=button]:active,button.card:active,.seg button:active,#tabbar button:active{
    transform:translateY(1px) scale(.98);
  }
  .btn:active:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.14),var(--sh-0)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost,.btn.danger{
    background-color:var(--g-chip);color:var(--t1);border-color:var(--rim);background-image:none;
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);
  }
  .btn.ghost:active:not(:disabled),.btn.danger:active:not(:disabled){box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  .btn.small{min-height:40px;padding:6px 16px;font-size:var(--fs-sm);border-radius:10px}
  .btn.danger{color:var(--red-text)}
  @media (hover:hover){ .btn:hover:not(:disabled){background-color:color-mix(in srgb,var(--pink) 92%,#fff)} .btn.ghost:hover:not(:disabled),.btn.danger:hover:not(:disabled){background-color:var(--g-bar)} }
  .field{
    width:100%;min-height:48px;padding:12px 16px;background:var(--field-bg);border:1px solid var(--hair);border-radius:var(--r-ctl);outline:none;
    box-shadow:inset 0 1px 3px rgba(24,14,6,.14),inset 0 -1px 0 var(--hi);
    transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
  }
  .field:focus{border-color:var(--pink-text);box-shadow:inset 0 1px 3px rgba(24,14,6,.14),0 0 0 3px rgba(187,56,98,.22)}
  #bootHero.bob{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}

  /* Usagi 图片 + 加载失败时的占位 */
  .usagi{display:block;object-fit:contain;border-radius:50%;background:var(--usagi-bg);padding:var(--usagi-pad)}
  .usagi-fallback{display:inline-block;line-height:1}

  /* 头像：玻璃圈 */
  .avatar{
    flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:2px solid var(--hi);border-radius:50%;background:var(--usagi-bg-av);
    box-shadow:0 1px 2px rgba(24,14,6,.14),0 3px 8px rgba(24,14,6,.1);
  }
  .avatar.default{background:var(--usagi-bg-av)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar.default img{object-fit:contain;padding:2px;background:none;border-radius:0}

  /* 登录 / 注册 */
  #auth{overflow-y:auto;padding:calc(var(--safe-t) + 16px) 24px calc(var(--safe-b) + 24px);align-items:center}
  #auth .hub-link{align-self:flex-start}
  .hero{width:144px;height:144px;margin-top:8px}
  .hero img,.hero .usagi-fallback{width:100%;height:100%;font-size:108px;text-align:center}
  .hero.cheer{animation:cheer .6s var(--ease)}
  @keyframes cheer{0%{transform:scale(.88) rotate(-4deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
  #auth h1{font-size:var(--fs-2xl);font-weight:600;line-height:1.2;margin-top:8px}
  #auth .sub{font-size:var(--fs-sm);color:var(--t2);margin:4px 0 20px}
  .auth-card{width:100%;padding:20px;border-radius:var(--r-panel)}
  .seg{display:flex;gap:4px;width:100%;padding:4px;border:1px solid var(--hair);border-radius:var(--r-ctl);background:var(--field-bg);box-shadow:inset 0 1px 3px rgba(24,14,6,.12),inset 0 -1px 0 var(--hi);margin-bottom:16px}
  .seg button{flex:1;padding:8px;font-weight:500;font-size:var(--fs-sm);color:var(--t2);border-radius:8px;transition:transform .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
  .seg button.on{background-color:var(--pink);color:var(--on-pink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(24,14,6,.18)}
  #authForm{width:100%;display:flex;flex-direction:column;gap:12px}
  .hint{font-size:var(--fs-xs);color:var(--t2);line-height:1.6;text-align:left}
  .msg{font-size:var(--fs-sm);font-weight:500;color:var(--red-text);text-align:left;line-height:1.5;min-height:0}
  .msg.ok{color:var(--ok)}
  .hub-link{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:var(--fs-sm);font-weight:500;color:var(--t2);text-decoration:none;padding:0 8px 0 0;transition:color .16s var(--ease)}
  .hub-link .i{width:20px;height:20px}
  @media (hover:hover){ .hub-link:hover{color:var(--t1)} }

  /* 主界面：顶栏和标签栏浮在最上层，内容在它们下面滚动 */
  #app{background:transparent}
  #views{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
  .top{
    flex:none;display:flex;align-items:center;gap:8px;min-height:var(--top-h);
    padding:var(--safe-t) 16px 0;border-width:0 0 1px;border-radius:0;
  }
  .view>.top{position:absolute;top:0;left:0;right:0;z-index:3}
  .top h2{flex:1;font-size:var(--fs-lg);font-weight:600;line-height:1.3}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--top-h) + 16px) 16px calc(var(--safe-b) + 104px)}
  .section-title{font-size:var(--fs-sm);font-weight:600;color:var(--t2);margin:8px 4px 12px;display:flex;align-items:center;gap:8px}
  .section-title .count{background:var(--g-chip);color:var(--t2);border:1px solid var(--hair);border-radius:10px;padding:0 8px;font-size:var(--fs-xs);font-weight:500;line-height:20px}

  .card{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 16px;margin-bottom:12px;border-radius:var(--r-card);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  button.card:active{box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  .card .avatar{width:48px;height:48px}
  .card .info{flex:1;min-width:0}
  .card .name{font-size:var(--fs-md);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .line2{font-size:var(--fs-sm);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .card .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .card .time{font-size:var(--fs-xs);color:var(--t3)}
  .card .actions{flex:none;display:flex;gap:8px}
  .badge{
    min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--badge);color:#fff;
    font-size:var(--fs-xs);font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(24,14,6,.25);
  }

  .empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px;text-align:center}
  .empty .usagi,.empty .usagi-fallback{width:96px;height:96px;font-size:72px}
  .empty p{font-size:var(--fs-sm);color:var(--t2);line-height:1.6}
  .empty.tiny{padding:12px}
  .empty.tiny .usagi,.empty.tiny .usagi-fallback{width:64px;height:64px;font-size:46px}

  /* 底部标签栏（浮在最上层的玻璃） */
  #tabbar{
    position:absolute;left:16px;right:16px;bottom:calc(var(--safe-b) + 12px);z-index:3;
    display:flex;gap:4px;height:64px;padding:4px;border-radius:var(--r-panel);
  }
  #tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;
    font-size:var(--fs-xs);font-weight:500;color:var(--t2);position:relative;
    transition:transform .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease);
  }
  #tabbar button.on{color:var(--pink-text);background:var(--g-chip);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  #tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px)}

  /* 好友页 */
  .search{display:flex;gap:8px;margin-bottom:16px}
  .search .field{flex:1}
  #searchResult{margin-bottom:8px}

  /* 我的 */
  .me-head{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 24px}
  .me-head .avatar{width:104px;height:104px;position:relative;border-width:3px}
  .me-head .name{font-size:var(--fs-xl);font-weight:600;line-height:1.3}
  .me-head .uname{font-size:var(--fs-xs);color:var(--t2)}
  .panel{border-radius:var(--r-card);padding:16px;margin-bottom:16px}
  .panel h3{font-size:var(--fs-sm);font-weight:600;color:var(--t2);margin-bottom:12px}
  .row-flex{display:flex;gap:8px;align-items:center}
  .row-flex .field{flex:1}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .switch-row .lbl{font-weight:500}
  .switch-row .state{font-size:var(--fs-xs);color:var(--t2)}
  .toggle{
    width:52px;height:32px;border:1px solid var(--hair);border-radius:16px;background:var(--field-bg);position:relative;flex:none;
    box-shadow:inset 0 1px 3px rgba(24,14,6,.16),inset 0 -1px 0 var(--hi);transition:background-color .16s var(--ease);
  }
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(24,14,6,.3),0 2px 5px rgba(24,14,6,.15);transition:transform .16s var(--ease)}
  .toggle[aria-checked="true"]{background:var(--pink)}
  .toggle[aria-checked="true"]::after{transform:translateX(20px)}
  .toggle:disabled{opacity:.45}

  /* 聊天页 */
  /* 聊天页用纯色背景（白天纯白、晚上纯深色），对方气泡换成自己的底色，避免在白底上看不见 */
  #chat{position:absolute;inset:0;z-index:5;background:var(--chat-bg);--bub-peer:var(--chat-bub-peer);--bub-bd:var(--chat-bub-bd)}
  #chat .top{gap:8px;padding-left:8px}
  #chat .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--t2);border-radius:var(--r-ctl);transition:transform .16s var(--ease)}
  #chat .back:active{transform:translateY(1px) scale(.98)}
  #chat .top .avatar{width:40px;height:40px}
  #chat .who{flex:1;min-width:0}
  #chat .who b{display:block;font-size:var(--fs-md);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chat .who span{font-size:var(--fs-xs);color:var(--t2)}
  #msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px 8px}
  #olderRow{text-align:center;font-size:var(--fs-xs);color:var(--t3);padding:8px}
  .row{display:flex;flex-direction:column;margin-bottom:8px}
  .line{display:flex;gap:8px;align-items:flex-start;max-width:100%}
  .row.own .line{flex-direction:row-reverse}
  .av-slot{flex:none;width:var(--av);height:var(--av)}
  .row .avatar{width:var(--av);height:var(--av)}
  .col{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 48px)}
  .row.own .col{align-items:flex-end}
  .row.peer .col{align-items:flex-start}

  /* 签名：时间分隔线是一根躺在玻璃上的巧克力蘸边 Pepero 饼干棒（只用在这里） */
  .stamp{align-self:center;display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--t2);margin:16px 0 12px;font-variant-numeric:tabular-nums}
  .stamp::after{
    content:"";flex:none;width:120px;height:8px;border-radius:4px;
    background:
      linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 55%),
      linear-gradient(90deg,var(--biscuit-a) 0,var(--biscuit-b) 34%,var(--choco-a) 34%,var(--choco-b) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.22),0 1px 1px rgba(24,14,6,.28),0 3px 5px rgba(24,14,6,.12);
  }

  /* 气泡不用 backdrop-filter：用半透明分层填充 + 高光模拟磨砂，滚动才顺 */
  .bubble{
    max-width:100%;padding:8px 12px;font-size:var(--fs-md);line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
    border:1px solid var(--bub-bd);border-radius:var(--r-bub);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
    background-color:var(--bub-peer);background-image:linear-gradient(var(--bub-sheen),rgba(255,255,255,0) 46%);
    box-shadow:inset 0 1px 0 var(--bub-hi),inset 0 -1px 0 var(--bub-lo),0 1px 2px rgba(24,14,6,.1),0 3px 8px rgba(24,14,6,.06);
  }
  .row.own .bubble{background-color:var(--bub-own);border-bottom-right-radius:var(--r-tail)}
  .row.peer .bubble{border-bottom-left-radius:var(--r-tail)}
  .row.sending .bubble{opacity:.65}
  .row.failed .bubble{background-color:var(--bub-fail)}
  .meta{font-size:var(--fs-xs);color:var(--t3);margin-top:4px;padding:0 4px;display:flex;gap:8px;align-items:center}
  .meta.read{color:var(--ok)}
  .meta.fail{color:var(--red-text);font-weight:500}
  .meta button{font-size:var(--fs-xs);font-weight:500;text-decoration:underline;color:var(--t2)}

  /* 引用回复：气泡下面的小引用条、输入栏上的引用提示、右滑回复、原文大图 */
  #msgs{overflow-x:hidden}
  .line{position:relative}
  .qt{
    display:block;max-width:100%;min-width:0;margin-top:4px;padding:4px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;
    font-size:var(--fs-xs);line-height:1.5;color:var(--t2);border:1px solid var(--hair);border-radius:10px;
    background:var(--hair);background:color-mix(in srgb,var(--t1) 6%,transparent);
  }
  .qt.pend,.qt.gone{color:var(--t3)}
  .qt.gone{font-style:italic}
  .qt:active{background:color-mix(in srgb,var(--t1) 11%,transparent)}
  #msgs.sand .qt{transition:opacity .35s}
  .row.sand-gone .qt{opacity:0}
  .bw.qflash .bubble{animation:qflash 1.5s ease-out}
  @keyframes qflash{
    0%,55%{box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 55%,transparent),0 0 18px color-mix(in srgb,var(--pink) 45%,transparent)}
    100%{box-shadow:0 0 0 3px transparent,0 0 18px transparent}
  }
  .rep{position:absolute;left:-44px;top:50%;width:32px;height:32px;margin-top:-16px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;color:var(--t2);background:var(--g-chip);border:1px solid var(--rim);box-shadow:inset 0 1px 0 var(--hi),var(--sh-1);opacity:0;pointer-events:none}
  .rep .i{width:18px;height:18px}
  .rep.on{color:var(--pink-text)}
  #composer{flex-wrap:wrap}
  #qbar{
    flex:0 0 100%;display:flex;align-items:center;gap:4px;min-width:0;padding:2px 2px 2px 12px;border-radius:10px;
    font-size:var(--fs-sm);color:var(--t2);border:1px solid var(--hair);background:var(--hair);background:color-mix(in srgb,var(--t1) 6%,transparent);
  }
  #qbarText{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #qbarX{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--t3);border-radius:50%}
  #qbarX:active{color:var(--t1)}
  #qsheet{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:color-mix(in srgb,var(--t1) 30%,transparent)}
  #qsheet .qs{
    width:100%;max-width:360px;max-height:70%;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-card);
    background:var(--g-card);border:1px solid var(--rim);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-2);
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  }
  #qsheet .qs-name{font-size:var(--fs-sm);color:var(--t2);font-weight:500}
  #qsheet .qs-text{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;font-size:var(--fs-lg);line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
  #qsheet .btn{align-self:flex-end}

  #composer{
    flex:none;display:flex;align-items:flex-end;gap:8px;border-width:1px 0 0;border-radius:0;
    padding:8px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 12px);
  }
  #composer textarea{
    flex:1;min-width:0;max-height:112px;resize:none;padding:10px 16px;line-height:1.4;
    border:1px solid var(--hair);border-radius:var(--r-ctl);outline:none;background:var(--field-bg);font-size:var(--fs-md);
    box-shadow:inset 0 1px 3px rgba(24,14,6,.14),inset 0 -1px 0 var(--hi);transition:border-color .16s var(--ease);
  }
  #composer textarea:focus{border-color:var(--pink-text)}
  .icon-btn{
    width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--t2);
    border:1px solid var(--rim);border-radius:var(--r-ctl);background:var(--g-chip);
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  .icon-btn:active{box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  #sendBtn{height:44px;padding:0 20px;min-height:44px}
  #emojiPanel{
    flex:none;margin:0 12px 8px;padding:12px 12px 8px;border-radius:var(--r-card);
    max-height:300px;overflow-y:auto;overscroll-behavior:contain;
  }
  .panel-label{font-size:var(--fs-xs);font-weight:500;color:var(--t2);margin:0 4px 8px}
  #fxRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  #fxRow button{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-width:0;
    background:var(--g-chip);border:1px solid var(--rim);border-radius:var(--r-ctl);
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);
    font-size:var(--fs-xs);font-weight:500;color:var(--t1);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  #fxRow button .ico{font-size:28px;line-height:1.1}
  #fxRow button:active{box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  #emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  #emojiGrid button{font-size:24px;line-height:1;padding:8px 0;border-radius:10px;transition:background-color .12s var(--ease)}
  #emojiGrid button:active{background:var(--g-chip)}

  /* 特效表情：气泡 + 全屏动画舞台 */
  .row .bubble.fx{
    display:flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;cursor:pointer;
    background-color:var(--bub-fx)!important;color:var(--t1)!important;font-weight:500;
    -webkit-user-select:none;user-select:none;transition:transform .16s var(--ease);
  }
  .bubble.fx .fx-ico{font-size:28px;line-height:1}
  .bubble.fx:active{transform:scale(.98)}
  #fxStage{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;background:var(--stage-bg)}
  #fxStage .fx-av{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%)}
  #fxStage .fx-av .avatar{position:relative;border-width:3px;box-shadow:0 2px 4px rgba(24,14,6,.16),0 10px 24px rgba(24,14,6,.18)}
  #fxStage .fx-cap{
    position:absolute;left:50%;top:calc(40% + 88px);transform:translateX(-50%);white-space:nowrap;max-width:calc(100% - 32px);
    overflow:hidden;text-overflow:ellipsis;padding:8px 16px;background:var(--g-card);border:1px solid var(--rim);border-radius:var(--r-card);
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-2);font-size:var(--fs-sm);font-weight:500;color:var(--t1);
  }
  .fx-p{position:absolute;left:0;top:0;line-height:1;will-change:transform,opacity}
  .fx-drop{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1faff,#6bb8e8 60%,#3d8fcb);box-shadow:0 0 0 1px rgba(31,127,214,.2)}
  .fx-wet{position:absolute;inset:0;border-radius:50%;opacity:0;background:radial-gradient(circle at 70% 40%,rgba(140,205,250,.7),rgba(90,165,230,.42) 60%,rgba(90,165,230,.22))}
  .fx-blush{position:absolute;width:26%;height:14%;bottom:24%;border-radius:50%;background:rgba(255,100,150,.55);filter:blur(2px);opacity:0}
  .fx-say{padding:4px 12px;background:var(--g-card);border:1px solid var(--rim);border-radius:var(--r-ctl);box-shadow:inset 0 1px 0 var(--hi),var(--sh-1);font-size:var(--fs-md);font-weight:600;color:var(--pink-text);white-space:nowrap}

  /* 气泡状态：特效表情留下的痕迹（湿透 / 爱心）。注意 .fx-wet 已被全屏动画占用，这里用 st- 前缀 */
  .bw{position:relative;max-width:100%}
  .deco{position:absolute;inset:0;pointer-events:none}
  .row.own .deco{border-radius:var(--r-bub) var(--r-bub) var(--r-tail) var(--r-bub)}
  .row.peer .deco{border-radius:var(--r-bub) var(--r-bub) var(--r-bub) var(--r-tail)}
  .row.st-wet:not(.failed) .bubble:not(.fx){
    background-color:var(--wet-bg);border-color:var(--wet-bd);color:var(--wet-fg);
    box-shadow:inset 0 -6px 10px rgba(60,130,190,.22),inset 0 1px 0 var(--bub-hi),0 1px 2px rgba(24,14,6,.1),0 3px 8px rgba(24,14,6,.06);
  }
  .row.st-love:not(.failed) .bubble:not(.fx){
    background-color:var(--love-bg);border-color:var(--love-bd);color:var(--love-fg);
    box-shadow:inset 0 0 14px rgba(255,255,255,.5),inset 0 1px 0 var(--bub-hi),0 1px 2px rgba(24,14,6,.1),0 3px 8px rgba(24,14,6,.06);
  }
  .row.st-love-2:not(.failed) .bubble:not(.fx){box-shadow:inset 0 0 14px rgba(255,255,255,.5),inset 0 1px 0 var(--bub-hi),0 1px 2px rgba(24,14,6,.1),0 0 10px rgba(var(--love-rgb),.3)}
  .row.st-love-3:not(.failed) .bubble:not(.fx){box-shadow:inset 0 0 14px rgba(255,255,255,.5),inset 0 1px 0 var(--bub-hi),0 1px 2px rgba(24,14,6,.1),0 0 16px rgba(var(--love-rgb),.45)}
  .row.st-wet:not(.failed) .bw{z-index:2}
  /* 水珠：几颗大小不一的小水珠挂在玻璃上，加一层顶部水光 */
  .row.st-wet:not(.failed) .bubble:not(.fx)+.deco::before,.bw.ev-dry .bubble:not(.fx)+.deco::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:
      radial-gradient(circle at 12% 34%,#fff 0 1px,rgba(255,255,255,.35) 1.4px 3px,rgba(20,70,110,.16) 3.2px 3.7px,transparent 4px),
      radial-gradient(circle at 31% 72%,#fff 0 1.2px,rgba(255,255,255,.35) 1.6px 4px,rgba(20,70,110,.16) 4.2px 4.8px,transparent 5px),
      radial-gradient(circle at 52% 24%,#fff 0 .8px,rgba(255,255,255,.35) 1.2px 2.4px,rgba(20,70,110,.14) 2.6px 3px,transparent 3.2px),
      radial-gradient(circle at 68% 66%,#fff 0 1.4px,rgba(255,255,255,.35) 1.8px 4.6px,rgba(20,70,110,.16) 4.8px 5.4px,transparent 5.6px),
      radial-gradient(circle at 86% 30%,#fff 0 1px,rgba(255,255,255,.35) 1.4px 3.2px,rgba(20,70,110,.16) 3.4px 3.9px,transparent 4.2px),
      radial-gradient(circle at 92% 78%,#fff 0 .8px,rgba(255,255,255,.35) 1.2px 2.4px,rgba(20,70,110,.14) 2.6px 3px,transparent 3.2px),
      linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 42%);
  }
  .drp{
    position:absolute;bottom:-4px;width:6px;height:9px;margin-left:-3px;opacity:0;
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,var(--drop) 55%,#3d8fcb);
    animation:drip 2s ease-in infinite;
  }
  @keyframes drip{0%{transform:translateY(-6px) scale(.5);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}70%{opacity:.9}100%{transform:translateY(26px) scale(.9);opacity:0}}
  .hrt{position:absolute;font-size:14px;line-height:1;color:var(--love-heart);text-shadow:0 0 3px var(--g-solid);animation:hbeat 1.6s var(--ease) infinite}
  @keyframes hbeat{50%{transform:scale(1.12)}}
  /* 状态变化时的一次性动画（加在 .bw 上） */
  .bw.ev-bonk{transform-origin:50% 100%;animation:bw-bonk .75s var(--ease)}
  @keyframes bw-bonk{0%{transform:none}18%{transform:scale(1.08,.7)}40%{transform:scale(.96,1.05)}62%{transform:scale(1.02,.98)}100%{transform:none}}
  .bw.ev-bounce{transform-origin:50% 100%;animation:bw-bounce .8s var(--ease)}
  @keyframes bw-bounce{0%{transform:none}22%{transform:scale(1.07,.9)}48%{transform:scale(.96,1.06) translateY(-6px)}72%{transform:scale(1.02,.98)}100%{transform:none}}

  /* 特效气泡里的引用（定向攻击） */

  }
  #toolGrid button .i{width:28px;height:28px;color:var(--pink-text)}
  #toolGrid button:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  .panel-up{animation:panelUp .28s var(--ease)}
  @keyframes panelUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  #appLayer{position:absolute;inset:0;z-index:0;--app-top:56px;--app-bot:72px;--app-h:460px}
  #appBody{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:calc(var(--app-top) + 8px) 16px calc(var(--app-bot) + 8px)}
  #appClose{
    position:absolute;top:calc(var(--app-top) + 8px);right:12px;z-index:1;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    color:var(--t2);background:var(--g-card);border:1px solid var(--rim);border-radius:50%;
    box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    transition:transform .16s var(--ease);
  }
  #appClose:active{transform:scale(.94)}
  /* 小程序打开时：消息漂在小程序上面，半透明、完全点不到；点击和长按直接穿透到下面的小程序 */
  #msgs{transition:opacity .25s var(--ease)}
  /* 开着小程序时：消息再淡一些（25%），对局卡片整行隐藏，避免和正在下的大棋盘叠在一起 */
  #chat.app-open #msgs,#chat.app-open #sandCv{opacity:.25;pointer-events:none}
  /* 像直播弹幕：只在输入栏上方留一条约 30% 高的带子（--strip-h 由 layoutApp 量出来），上沿柔和淡出；上面整块留给小程序 */
  #chat.app-open #msgs,#chat.app-open #sandCv{
    -webkit-mask-image:linear-gradient(to top,#000 calc(var(--strip-h,30%) - 36px),transparent var(--strip-h,30%));
    mask-image:linear-gradient(to top,#000 calc(var(--strip-h,30%) - 36px),transparent var(--strip-h,30%));
  }
  #chat.app-open #msgs .row.row-game{display:none}
  #chat.app-open #msgs *{pointer-events:none!important}

  /* 紧凑布局：两位玩家在左右，状态和认输/再来一局叠在中间，棋盘在下；左右各留出 48px 避开右上角的 × */
  .ttt{width:100%;max-width:340px;margin:auto;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(88px,auto) minmax(0,1fr) 48px;align-items:center}
  .ttt-players{display:contents}
  .ttt-vs{display:none}
  .ttt-p{grid-row:1/3;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:1px solid transparent;border-radius:var(--r-ctl);transition:background-color .2s var(--ease),border-color .2s var(--ease)}
  .ttt-p:first-child{grid-column:2}
  .ttt-p:last-child{grid-column:4}
  .ttt-p.turn{background:var(--g-chip);border-color:var(--rim);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1)}
  .ttt-av{position:relative;width:44px;height:44px}
  .ttt-av .avatar{width:44px!important;height:44px!important}
  .ttt-badge{position:absolute;right:-8px;bottom:-4px;width:22px;height:22px;padding:2px;border-radius:50%;background:var(--g-solid);border:1px solid var(--rim);box-shadow:var(--sh-1)}
  .ttt-badge .mk{width:100%;height:100%}
  .ttt-p b{max-width:100%;font-size:var(--fs-xs);font-weight:500;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttt-status{grid-column:3;grid-row:1;align-self:end;min-height:24px;padding:0 4px;font-size:var(--fs-lg);font-weight:600;color:var(--t1);text-align:center}
  .ttt-status.you{color:var(--pink-text)}
  /* 格子随小程序区域的高度缩放：不小于 72px（窄屏 64px），不大于 96px */
  .ttt-board{--cell:clamp(72px,calc((var(--app-h) - 120px)/3),96px);grid-column:1/-1;grid-row:3;justify-self:center;margin-top:10px;position:relative;display:grid;grid-template-columns:repeat(3,var(--cell));grid-auto-rows:var(--cell);gap:8px}
  @media (max-width:359px){.ttt-board{--cell:clamp(64px,calc((var(--app-h) - 120px)/3),88px)}}
  .ttt-cell{
    width:var(--cell);height:var(--cell);padding:18px;display:block;border-radius:var(--r-ctl);
    background:var(--g-chip);border:1px solid var(--rim);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  .ttt-cell.open{cursor:pointer}
  .ttt-cell.open:active{transform:scale(.96);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-0)}
  .ttt-cell svg{display:block;width:100%;height:100%}
  .mk{fill:none;stroke-width:5;stroke-linecap:round}
  .mk.x{stroke:var(--pink)}
  .mk.o{stroke:var(--t2)}
  .mk.anim path,.mk.anim circle{stroke-dasharray:1;stroke-dashoffset:1;animation:tttDraw .34s var(--ease) forwards}
  .mk.anim path+path{animation-delay:.16s}
  @keyframes tttDraw{to{stroke-dashoffset:0}}
  .ttt-win{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .ttt-win line{stroke:var(--pink-text);stroke-width:2.4;stroke-linecap:round;opacity:.92}
  .ttt-win.anim line{stroke-dasharray:1;stroke-dashoffset:1;animation:tttDraw .5s var(--ease) .1s forwards}
  .ttt-board.shake{animation:tttShake .5s var(--ease)}
  @keyframes tttShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  .ttt-actions{grid-column:3;grid-row:2;align-self:start;min-height:44px;display:flex;justify-content:center;align-items:center;text-align:center}
  .ttt-actions .btn{white-space:normal;line-height:1.3}
  .ttt-actions .btn.quiet{background:none;border:0;box-shadow:none;color:var(--t2);text-decoration:underline;text-underline-offset:3px}
  .ttt-actions .btn.quiet.sure{color:var(--red-text);font-weight:600}

  /* 聊天里的井字棋卡片 */
  .row .bubble.gcard{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .16s var(--ease)}
  .bubble.gcard:active{transform:scale(.98)}
  .gc-board{flex:none;display:grid;grid-template-columns:repeat(3,22px);grid-auto-rows:22px;gap:2px;padding:2px;border-radius:10px;background:color-mix(in srgb,var(--t1) 10%,transparent)}
  .gc-cell{display:block;padding:3px;border-radius:5px;background:color-mix(in srgb,var(--chat-bg) 70%,transparent)}
  .gc-cell .mk{display:block;width:100%;height:100%;stroke-width:6}
  .gc-txt{display:flex;flex-direction:column;min-width:0;line-height:1.35;text-align:left}
  .gc-txt b{font-size:var(--fs-md);font-weight:600;color:var(--t1)}
  .gc-st{font-size:var(--fs-sm);color:var(--t2);white-space:nowrap}
  .gc-st.you{font-weight:600;color:var(--t1)}

  /* 弹弓大战：HUD、画布、弹药栏；聊天里的卡片预览 */
  #toolGrid button .tool-img{width:32px;height:32px;object-fit:contain;margin:-2px 0}
  .gc-sl{flex:none;position:relative;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--t1) 10%,transparent);display:flex;align-items:center;justify-content:center}
  .gc-sl img{width:34px;height:34px;object-fit:contain}
  .gc-score{position:absolute;right:-6px;bottom:-6px;min-width:26px;padding:1px 5px;border-radius:10px;background:var(--g-solid);border:1px solid var(--rim);box-shadow:var(--sh-1);font-size:var(--fs-xs);font-weight:600;line-height:1.4;color:var(--t1);text-align:center}
  .sl{flex:1;min-height:0;width:calc(100% + 32px);margin:0 -16px;display:flex;flex-direction:column;gap:8px}
  .sl-msg{margin:auto;padding:0 24px;text-align:center;color:var(--t2)}
  .sl-hud{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:0 68px 0 16px;min-height:44px}
  .sl-pl{display:flex;align-items:center;gap:8px;min-width:0}
  .sl-pl.r{justify-content:flex-end}
  .sl-av{position:relative;width:40px;height:40px;padding:2px;border-radius:50%;border:2px solid transparent;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .sl-av .avatar{width:32px!important;height:32px!important}
  .sl-av.turn{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 28%,transparent)}
  .sl-score{font-size:var(--fs-xl);font-weight:700;color:var(--t1);min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
  .sl-mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
  .sl-stat{font-size:var(--fs-sm);font-weight:600;color:var(--t2);white-space:nowrap}
  .sl-stat.you{color:var(--pink-text)}
  .sl-wind{display:flex;align-items:center;gap:6px;min-height:16px;font-size:var(--fs-xs);color:var(--t2);white-space:nowrap}
  .sl-wind svg{display:block;color:var(--t2)}
  .sl-stage{position:relative;flex:1;min-height:150px;margin:0 12px;overflow:hidden;border-radius:var(--r-card);border:1px solid var(--rim);box-shadow:var(--sh-1);background:var(--g-card)}
  .sl-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  .sl-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--toast-bg);color:var(--toast-fg);font-size:var(--fs-xs);pointer-events:none;white-space:nowrap}
  .sl-stage.shake{animation:tttShake .5s var(--ease)}
  .sl-bar{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;min-height:48px}
  .sl-ammo{flex:1;min-width:0;display:flex;gap:6px}
  .sl-chip{flex:1;min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 4px;font-size:var(--fs-xs);font-weight:500;color:var(--t1);background:var(--g-chip);border:1px solid var(--rim);border-radius:var(--r-ctl);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--sh-1);transition:transform .16s var(--ease),border-color .16s var(--ease)}
  .sl-chip img{width:26px;height:26px;object-fit:contain;flex:none}
  .sl-chip.on{border-color:var(--pink);box-shadow:0 0 0 2px color-mix(in srgb,var(--pink) 40%,transparent),var(--sh-1)}
  .sl-chip:active{transform:scale(.97)}
  .sl-act{flex:none;display:flex;align-items:center}
  .sl-act .btn.quiet{background:none;border:0;box-shadow:none;color:var(--t2);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}
  .sl-act .btn.quiet.sure{color:var(--red-text);font-weight:600}
  .sl-ammo[hidden]{display:none}
  .sl-bar:has(.sl-ammo[hidden]){justify-content:center}
  .sl-bar:has(.sl-ammo[hidden]) .sl-act{flex:1;justify-content:center}
  .sl-bar:has(.sl-ammo[hidden]) .sl-act .btn{flex:1;max-width:240px}
  @media (prefers-reduced-motion:reduce){.panel-up,.ttt-board.shake,.sl-stage.shake{animation:none}.mk.anim path,.mk.anim circle,.ttt-win.anim line{animation-duration:.01s;animation-delay:0s}}
  /* 不支持 backdrop-filter 的浏览器：玻璃退成更不透明的纯色填充 */
  @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .top,#tabbar,#composer,#emojiPanel,#plusPanel,.panel,#view-friends .card,.auth-card{background:var(--g-solid)}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<div id="shell">

  <section id="boot" class="screen center">
    <div class="hero bob" id="bootHero"></div>
    <p class="hint" style="text-align:center">载入中…</p>
  </section>

  <section id="unconfigured" class="screen center" hidden>
    <div class="hero" id="unconfHero"></div>
    <h1 style="font-size:var(--fs-xl);font-weight:600;line-height:1.3">后端未配置</h1>
    <p class="hint" style="text-align:center">这个页面还没有连上 Supabase。部署时会自动填入地址；本地调试请在浏览器控制台设置 chat.devSupabaseUrl 和 chat.devSupabaseAnonKey（localStorage）后刷新。</p>
    <a class="hub-link" href="../"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>回到小程序</a>
  </section>

  <section id="auth" class="screen" hidden>
    <a class="hub-link" href="../"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>小程序</a>
    <div class="hero bob" id="heroBox"></div>
    <h1>耳朵聊天</h1>
    <p class="sub">和好朋友说说话</p>
    <div class="auth-card">
    <div class="seg" role="tablist">
      <button type="button" id="segLogin" class="on" role="tab">登录</button>
      <button type="button" id="segRegister" role="tab">注册</button>
    </div>
    <form id="authForm" novalidate>
      <input class="field" id="fUser" type="text" placeholder="用户名（小写字母、数字、下划线）" maxlength="20"
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <input class="field" id="fNick" type="text" placeholder="昵称（可选，最多 20 个字）" maxlength="20" autocomplete="nickname" hidden>
      <input class="field" id="fPass" type="password" placeholder="密码（至少 6 位）" maxlength="72"
             autocomplete="current-password" enterkeyhint="go">
      <p class="hint" id="regHint" hidden>用户名注册后不能修改，好友会用它来找到你。</p>
      <p class="msg" id="authMsg" role="alert"></p>
      <button class="btn" type="submit" id="authSubmit">登录</button>
    </form>
    </div>
  </section>

  <section id="app" class="screen" hidden>
    <div id="views">
      <div class="view" id="view-chats">
        <div class="top"><a class="hub-link" href="../"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>小程序</a><h2>消息</h2></div>
        <div class="scroll" id="chatList"></div>
      </div>
      <div class="view" id="view-friends" hidden>
        <div class="top"><a class="hub-link" href="../"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>小程序</a><h2>好友</h2></div>
        <div class="scroll">
          <form class="search" id="searchForm" novalidate>
            <input class="field" id="searchInput" type="text" placeholder="输入对方的用户名" maxlength="20"
                   autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <button class="btn small" type="submit" id="searchBtn" style="min-height:48px">搜索</button>
          </form>
          <div id="searchResult"></div>
          <div id="friendsBody"></div>
        </div>
      </div>
      <div class="view" id="view-me" hidden>
        <div class="top"><a class="hub-link" href="../"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>小程序</a><h2>我的</h2></div>
        <div class="scroll" id="meBody"></div>
      </div>

    <nav id="tabbar">
      <button type="button" data-tab="chats" class="on"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>消息<span class="badge" id="badgeChats" hidden></span></button>
      <button type="button" data-tab="friends"><svg class="i" aria-hidden="true"><use href="#i-users"/></svg>好友<span class="badge" id="badgeFriends" hidden></span></button>

      <div id="olderRow" hidden>加载更早的消息…</div>

      <button type="button" class="icon-btn" id="plusBtn" aria-label="更多功能" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-plus-circle"/></svg></button>
      <button type="button" class="btn" id="sendBtn">发送</button>
    </div>

  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="pop" hidden></div>
</div>

<script>
(function () {
  'use strict';

  // ===== 配置 =====
  // 部署时由 GitHub Actions 用仓库变量替换这两个占位符；本地调试从 localStorage 读取
  var CFG_URL = '__SUPABASE_URL__';

      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {

  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function fmtTime(iso) {
    var d = new Date(iso), now = new Date();
    if (sameDay(d, now)) return hhmm(d);
    var y = new Date(now.getTime() - 86400000);
    if (sameDay(d, y)) return '昨天 ' + hhmm(d);
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
  function fmtStamp(iso) {
    var d = new Date(iso), now = new Date();

  function errText(e) {
    var m = (e && e.message) || '';
    if (ERR_TEXT[m]) return ERR_TEXT[m];
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return '网络不太好，稍后再试';
    if (/JWT|expired/i.test(m)) return ERR_TEXT.not_authenticated;
    return '出错了，请稍后再试';
  }
  function authErrText(e) {
    var code = (e && (e.code || e.error_code)) || '', m = ((e && e.message) || '').toLowerCase();
    if (code === 'invalid_credentials' || /invalid login credentials/.test(m)) return '用户名或密码不对';
    if (code === 'user_already_exists' || code === 'email_exists' || /already (been )?registered|already exists/.test(m)) return '这个用户名已经被占用了';
    if (code === 'weak_password' || /password should be at least|weak/.test(m)) return '密码太简单，至少需要 6 位（建议字母加数字）';
    if (code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit' || (e && e.status === 429) || /rate limit|too many/.test(m)) return '操作太频繁了，请过一会儿再试';
    if (code === 'email_not_confirmed' || /email not confirmed/.test(m)) return '账号还没有通过邮箱验证。请管理员在 Supabase 后台关闭 “Confirm email”。';
    if (code === 'email_address_invalid' || /email address .*invalid|invalid email|unable to validate email/.test(m)) {
      return '服务器不接受这个邮箱格式（' + EMAIL_DOMAIN + '）。请管理员修改页面里的 EMAIL_DOMAIN。';
    }
    if (/database error saving new user/.test(m)) return '这个用户名不能用，请用 3 到 20 位小写字母、数字或下划线';
    if (code === 'signup_disabled' || /signups? not allowed|signup is disabled/.test(m)) return '当前不开放注册';
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return '网络不太好，稍后再试';
    return '出错了，请稍后再试';
  }

  async function submitAuth(ev) {
    ev.preventDefault();
    if (authBusy) return;
    var username = $('fUser').value.trim().toLowerCase();
    var password = $('fPass').value;
    if (!USERNAME_RE.test(username)) return authMsg('用户名需要 3 到 20 位，只能用小写字母、数字和下划线');
    if (password.length < 6) return authMsg('密码至少需要 6 位');
    var email = username + '@' + EMAIL_DOMAIN;
    authBusy = true;
    $('authSubmit').disabled = true;
    authMsg('');
    try {
      var res;
      if (authMode === 'register') {
        var av = await sb.rpc('username_available', { p_username: username });
        if (!av.error && av.data === false) { authMsg('这个用户名已经被占用了，换一个吧'); return finishAuthFail(); }
        var nickname = $('fNick').value.trim().slice(0, 20);
        res = await sb.auth.signUp({ email: email, password: password, options: { data: nickname ? { nickname: nickname } : {} } });
        if (res.error) { authMsg(authErrText(res.error)); return finishAuthFail(); }
        if (!res.data.session) {
          authMsg('注册成功，但服务器要求邮箱验证，暂时无法登录。请管理员在 Supabase 后台（Authentication，Sign In / Providers，Email）关闭 “Confirm email”。');
          return finishAuthFail();
        }
      } else {
        res = await sb.auth.signInWithPassword({ email: email, password: password });
        if (res.error) { authMsg(authErrText(res.error)); return finishAuthFail(); }
      }
      // 成功：Usagi 喊一声“呀哈”，再进入
      var hero = $('heroBox');
      setUsagi(hero, 'yaha');
      hero.classList.remove('bob');
      hero.classList.add('cheer');
      authMsg(authMode === 'register' ? '注册成功，欢迎你' : '登录成功', true);
      await sleep(900);
      $('fPass').value = '';
      await enterApp();
    } catch (e) {
      authMsg(authErrText(e));
      finishAuthFail();
    }
  }

    var u = (await sb.auth.getUser()).data.user;
    if (!u) throw new Error('not_authenticated');
    var r = await sb.from('profiles').select('id,username,nickname,avatar_path').eq('id', u.id).maybeSingle();
    if (r.error) throw r.error;
    if (!r.data) throw new Error('profile_missing');
    S.me = r.data;
    S.profiles.set(S.me.id, S.me);
  }
  var loadingAll = null, loadAgain = false;
  function loadAll() {
    // 合并并发调用：正在加载时只记一个“再来一次”
    if (loadingAll) { loadAgain = true; return loadingAll; }
    loadingAll = (async function () {
      try {
        do {
          loadAgain = false;
          var rs = await Promise.all([
            sb.rpc('list_conversations'),
            sb.from('friendships').select('id,requester_id,addressee_id,status,updated_at'),
            sb.from('profiles').select('id,username,nickname,avatar_path')
          ]);
          var bad = rs.find(function (r) { return r.error; });
          if (bad) { if (isVisible()) toast(errText(bad.error)); return false; }
          S.convs = rs[0].data || [];
          S.friendships = rs[1].data || [];
          var map = new Map();
          (rs[2].data || []).forEach(function (p) { map.set(p.id, p); });
          if (S.me && !map.has(S.me.id)) map.set(S.me.id, S.me);
          S.profiles = map;
          if (S.me && map.get(S.me.id)) S.me = map.get(S.me.id);
          renderAll();
          // 重新加载后，打开且可见的会话若还有未读，补标一次
          if (S.chat && isVisible()) { var oc = convOf(S.chat.peer); if (oc && Number(oc.unread_count) > 0) markReadIfNeeded(); }
        } while (loadAgain);
        return true;
      } finally { loadingAll = null; }
    })();
    return loadingAll;
  }

  // ===== 头像上传：居中裁成正方形，缩到 256px，WebP（不支持则 JPEG） =====
  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }
  function canvasBlob(canvas, type, q) {
    return new Promise(function (resolve) { canvas.toBlob(resolve, type, q); });
  }
  async function makeAvatarBlob(file) {
    var img = await loadImage(file);
    var w = img.naturalWidth || img.width, hgt = img.naturalHeight || img.height;
    if (!w || !hgt) throw new Error('decode');
    var side = Math.min(w, hgt);
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 256, 256);
    ctx.drawImage(img, (w - side) / 2, (hgt - side) / 2, side, side, 0, 0, 256, 256);
    var blob = await canvasBlob(canvas, 'image/webp', 0.85);
    if (blob && blob.type === 'image/webp') return { blob: blob, ext: 'webp', type: 'image/webp' };
    blob = await canvasBlob(canvas, 'image/jpeg', 0.88); // Safari 等不支持 WebP 编码
    if (!blob) throw new Error('encode');
    return { blob: blob, ext: 'jpg', type: 'image/jpeg' };
  }

  var swReg = null;

  // ===== Web Push =====
  function pushSupported() { return 'PushManager' in window && 'serviceWorker' in navigator && 'Notification' in window; }
  function urlB64ToBytes(b64) {
    var pad = '='.repeat((4 - b64.length % 4) % 4);
    var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function bytesToB64Url(buf) {
    var bin = '', a = new Uint8Array(buf);
    for (var i = 0; i < a.length; i++) bin += String.fromCharCode(a[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function savePushSub(sub) {
    var j = sub.toJSON();
    var keys = j.keys || {};
    var r = await sb.rpc('save_push_subscription', {
      p_endpoint: sub.endpoint,
      p_p256dh: keys.p256dh || bytesToB64Url(sub.getKey('p256dh')),
      p_auth: keys.auth || bytesToB64Url(sub.getKey('auth')),
      p_user_agent: navigator.userAgent.slice(0, 300)

    return r.error;
  }
  // 订阅并保存；成功返回 null，失败返回中文提示
  async function pushSubscribe() {

      if (!reg) return '通知服务还没准备好，请刷新页面后再试';
      var sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(VAPID_PUBLIC_KEY) });
      var err = await savePushSub(sub);
      if (err) { console.error(err); return '保存通知设置失败，请稍后再试'; }
      return null;
    } catch (e) {
      console.error(e);
      return '开启通知失败，请稍后再试';
    }
  }
  // 关闭通知或退出登录：取消订阅并删除服务器上的记录（尽力而为）
  async function pushUnsubscribe() {

    try {

      if (!sub) return;
      var endpoint = sub.endpoint;

  // 合并服务器返回的消息：按 id 去重，已有的更新已读状态
  function mergeRows(rows) {
    var c = S.chat; if (!c) return false;
    var changed = false;
    rows.forEach(function (r) {
      if (c.ids.has(r.id)) {
        var ex = c.msgs.find(function (m) { return m.id === r.id; });
        if (ex && ex.read_at !== r.read_at) { ex.read_at = r.read_at; changed = true; }
        if (ex && markReplyGone(ex, r)) changed = true;
        return;
      }
      // 乐观消息已经被确认成同一个 id 的情况在 confirmSent 里处理，这里只加新的
      c.ids.add(r.id);
      c.msgs.push(msgFromRow(r));
      changed = true;
    });

  function sortMsgs() {

      if (a.id != null && b.id != null) return a.id - b.id;

        var a = cx.getImageData(4, 2, 1, 1).data, b = cx.getImageData(Math.floor(im.naturalWidth / 2), im.naturalHeight - 3, 1, 1).data;
        V.skyTop = 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; V.ground = 'rgb(' + b[0] + ',' + b[1] + ',' + b[2] + ')';
      } catch (e) { V.skyTop = key === 'bgNight' ? '#2a1b2c' : '#f9c9d0'; V.ground = key === 'bgNight' ? '#4a2c1a' : '#d89a3c'; }
    }
    if (!V.bgKey) { var dk = slDark(); V.skyTop = dk ? '#2a1b2c' : '#f9c9d0'; V.ground = dk ? '#4a2c1a' : '#d89a3c'; }
    return im && im._ok ? im : null;
  }
  function slDraw(V, ts) {
    var c = V.ctx, cam = V.cam, k = V.dpr * cam.s, sim = V.sim, i, b, shx = 0;
    var bg = slBg(V);
    if (V.shake > 0) shx = Math.sin(ts / 22) * V.shake * 9;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = V.skyTop; c.fillRect(0, 0, V.cv.width, V.cv.height);
    c.setTransform(k, 0, 0, k, V.dpr * (V.cw / 2 - cam.x * cam.s + shx), V.dpr * (V.ch / 2 - cam.y * cam.s));
    c.fillStyle = V.ground; c.fillRect(-3000, SLH - 1, SLW + 6000, 4000);
    if (bg) c.drawImage(bg, 0, 0, SLW, SLH);
    else { c.fillStyle = V.skyTop; c.fillRect(0, 0, SLW, SLH); c.fillStyle = V.ground; c.fillRect(0, PLAT_Y, PLAT_X, 200); c.fillRect(SLW - PLAT_X, PLAT_Y, PLAT_X, 200); }
    if (!sim) return;
    var g = V.g, side = g ? slSide(g) : 0, wind = g ? Number(g.wind) || 0 : 0;
    // 旗子和弹弓
    var lay = sim.layouts, sw = SLI.sling._ok;
    for (i = 0; i < 2; i++) {
      var fl = lay[i].flag, im = SLI.flag;
      if (im._ok) {
        c.save(); c.translate(fl.x, fl.y); c.rotate((i === 0 ? 1 : 1) * wind * 0.22);
        c.drawImage(im, -14, -50, 34, 50); c.restore();
      }
      var ax = i === 0 ? SL_ANCHOR.x : SLW - SL_ANCHOR.x;
      c.save(); c.translate(ax, PLAT_Y + 6); if (i === 1) c.scale(-1, 1);
      if (sw) c.drawImage(SLI.sling, -52, -166, 104, 172);
      else { c.fillStyle = '#6b3e26'; c.fillRect(-8, -130, 16, 136); }
      c.restore();
    }
    // 方块（带冲击后的回弹偏移，让快照对齐不突兀）
    var all = sim.blocks, off = V.off, nb = all.length;
    c.globalAlpha = V.appear;
    for (i = 0; i < nb; i++) {
      b = all[i];
      if (b.sl.broken) continue;
      var o = off && off[i], bx = b.position.x + (o ? o.x : 0), by = b.position.y + (o ? o.y : 0), ba = b.angle + (o ? o.a : 0), d = b.sl;
      c.save(); c.translate(bx, by + (1 - V.appear) * -30); c.rotate(ba);
      var bi = SLI[d.type];
      if (bi._ok) c.drawImage(bi, -d.w / 2 - 1.5, -d.h / 2 - 1.5, d.w + 3, d.h + 3);
      else { c.fillStyle = d.type === 'chocolate' ? '#6b3e26' : d.type === 'wafer' ? '#f4a8bc' : '#e1ac62'; c.fillRect(-d.w / 2, -d.h / 2, d.w, d.h); }
      var hr = d.hp / d.maxhp;
      if (hr < 0.65) {
        c.strokeStyle = 'rgba(50,25,10,' + (0.55 * (1 - hr)).toFixed(2) + ')'; c.lineWidth = 2; c.beginPath();
        var q = (d.id * 7) % 5 - 2;
        c.moveTo(-8 + q, -d.h / 2); c.lineTo(-2 + q, -4); c.lineTo(-12 + q, 6); c.lineTo(-6 + q, d.h / 2);
        if (hr < 0.35) { c.moveTo(14, -d.h / 2); c.lineTo(8, 2); c.lineTo(16, d.h / 2); }
        c.stroke();
      }
      if (d.frozen) {
        c.fillStyle = 'rgba(150,205,245,0.38)'; c.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
        if (SLI.ice._ok) { c.globalAlpha = V.appear; c.drawImage(SLI.ice, -d.w / 2 - 4, -d.h / 2 - 4, d.w + 8, d.h + 8); c.drawImage(SLI.ice, -d.w / 2 - 4, -d.h / 2 - 4, d.w + 8, d.h + 8); }
        c.strokeStyle = 'rgba(210,235,255,0.9)'; c.lineWidth = 2; c.strokeRect(-d.w / 2 + 1, -d.h / 2 + 1, d.w - 2, d.h - 2);
      }
      c.restore();
    }
    // 头像
    for (i = 0; i < 2; i++) {
      var a = sim.av[i], oo = off && off[nb + i], ax2 = a.position.x + (oo ? oo.x : 0), ay2 = a.position.y + (oo ? oo.y : 0) + (1 - V.appear) * -30;
      var mine = (i === side), im2 = V.avImg[i];
      c.save(); c.translate(ax2, ay2); c.rotate(a.angle + (oo ? oo.a : 0));
      c.beginPath(); c.arc(0, 0, AV_R + 3, 0, 6.2832); c.fillStyle = '#f6e8dc'; c.fill();
      c.save(); c.beginPath(); c.arc(0, 0, AV_R + 1, 0, 6.2832); c.clip();
      if (im2 && im2._ok) { var iw = im2.naturalWidth, ih = im2.naturalHeight, m = Math.min(iw, ih); c.drawImage(im2, (iw - m) / 2, (ih - m) / 2, m, m, -AV_R - 1, -AV_R - 1, 2 * AV_R + 2, 2 * AV_R + 2); }
      c.restore();
      c.lineWidth = 3; c.strokeStyle = mine ? '#ff8fab' : '#8a5233'; c.beginPath(); c.arc(0, 0, AV_R + 2, 0, 6.2832); c.stroke();
      c.restore();
    }
    c.globalAlpha = 1;
    // 瞄准：橡皮筋、装好的弹药、弹道点
    var ammoK = V.ammo, r0 = SL_AMMO[ammoK].r, ap = SLI[ammoK];
    if (slMyTurn() || (V.mode === 'idle' && V.aim)) {
      var dir = side === 0 ? 1 : -1, ax3 = side === 0 ? SL_ANCHOR.x : SLW - SL_ANCHOR.x, ay3 = SL_ANCHOR.y;
      var px = ax3, py = ay3;
      if (V.aim) { px += V.aim.dx; py += V.aim.dy; }
      c.strokeStyle = '#ff8fab'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(ax3 - 20 * dir, ay3 + 4); c.lineTo(px, py); c.lineTo(ax3 + 20 * dir, ay3 + 4); c.stroke();
      if (ap._ok) c.drawImage(ap, px - r0 * 1.25, py - r0 * 1.25, r0 * 2.5, r0 * 2.5);
      if (V.aim && V.aim.valid) {
        var pts = slPreview(side, V.aim.angle, V.aim.power, wind, 40), j;
        for (j = 2; j < pts.length; j += 3) {
          var f = 1 - j / pts.length;
          c.beginPath(); c.arc(pts[j].x, pts[j].y, 3 + 4 * f, 0, 6.2832);
          c.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.6 * f).toFixed(2) + ')'; c.fill();
          c.lineWidth = 1.5; c.strokeStyle = 'rgba(107,62,38,' + (0.3 + 0.5 * f).toFixed(2) + ')'; c.stroke();
        }
      }
    }
    // 飞行中的弹药和拖尾
    if (sim.proj) {
      var pj = sim.proj, pim = SLI[pj.sl.ammo], t, tr = V.trail;
      for (t = 0; t < tr.length; t += 3) {
        c.beginPath(); c.arc(tr[t].x, tr[t].y, 2 + 3 * (t / tr.length), 0, 6.2832);
        c.fillStyle = 'rgba(255,255,255,' + (0.5 * t / tr.length).toFixed(2) + ')'; c.fill();
      }
      c.save(); c.translate(pj.position.x, pj.position.y); c.rotate(pj.angle);
      var rr = pj.sl.r * 1.3;
      if (pim._ok) c.drawImage(pim, -rr, -rr, rr * 2, rr * 2);
      c.restore();
    }
    // 粒子
    for (i = 0; i < V.parts.length; i++) {
      var p = V.parts[i], lf = p.life / p.max;
      if (p.fx === 'boom') {
        var sz = 120 + 300 * Math.min(1, lf * 1.6);
        c.globalAlpha = 1 - lf * lf;
        if (SLI.boom._ok) c.drawImage(SLI.boom, p.x - sz / 2, p.y - sz / 2, sz, sz);
        c.globalAlpha = 1;
      } else {
        c.save(); c.globalAlpha = 1 - lf; c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.c; c.fillRect(-p.r, -p.r * 0.7, p.r * 2, p.r * 1.4); c.restore();
      }
    }
  }

  // ===== 键盘与视口（iOS 键盘弹出时让输入栏保持可见） =====
  function fitViewport() {
    var vv = window.visualViewport, shell = $('shell');
    if (!vv) return;
    shell.style.height = vv.height + 'px';
    shell.style.top = vv.offsetTop + 'px';
    layoutApp();
    if (S.chat && nearBottom()) scrollToBottom();
  }

  // ===== 事件 =====
  function bind() {
    $('segLogin').addEventListener('click', function () { setAuthMode('login'); });
    $('segRegister').addEventListener('click', function () { setAuthMode('register'); });
    $('authForm').addEventListener('submit', submitAuth);
    $('searchForm').addEventListener('submit', doSearch);
    document.querySelectorAll('#tabbar button').forEach(function (b) {
      b.addEventListener('click', function () { showTab(b.dataset.tab); });
    });
    $('chatBack').addEventListener('click', function () {
      if (history.state && history.state.chat) history.back(); else closeChat();
    });
    window.addEventListener('popstate', function () { if (S.chat) closeChat(); });
    $('emojiBtn').addEventListener('click', function () { setPanel($('emojiPanel').hidden ? 'emoji' : null); });
    $('plusBtn').addEventListener('click', function () { setPanel($('plusPanel').hidden ? 'plus' : null); });
    $('appClose').addEventListener('click', closeApp);
    var send = $('sendBtn');
    send.addEventListener('pointerdown', function (ev) { ev.preventDefault(); }); // 点发送不收起键盘
    send.addEventListener('click', sendCurrent);
    var input = $('input');
    input.addEventListener('input', autosize);
    input.addEventListener('focus', function () { closePanels(); setTimeout(function () { window.scrollTo(0, 0); if (S.chat) scrollToBottom(); }, 250); });
    input.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || ev.shiftKey || ev.isComposing || ev.keyCode === 229) return;
      if (window.matchMedia('(pointer:fine)').matches) { ev.preventDefault(); sendCurrent(); } // 电脑上回车发送，手机上回车换行
    });
    if (window.ResizeObserver) new ResizeObserver(function () { layoutApp(); }).observe($('composer')); // 输入框变高/引用条出现
    $('msgs').addEventListener('scroll', function () { if ($('msgs').scrollTop < 60) loadOlder(); }, { passive: true });
    bindSwipeQuote();
    bindLongPress();
    document.addEventListener('visibilitychange', function () {
      if (isVisible() && S.me) refreshAll();
    });
    window.addEventListener('online', function () { if (S.me) refreshAll(); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
      window.visualViewport.addEventListener('scroll', fitViewport);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (ev) {
        var d = ev.data || {};
        if (d.type !== 'notification-click' || !S.me) return;
        if (d.peer && /^[0-9a-f-]{36}$/i.test(d.peer)) { showTab('chats'); openChat(d.peer.toLowerCase()); }
        else if (d.tab) { if (S.chat) closeChat(); showTab(d.tab); }
      });
    }
  }

  // ===== 启动 =====
  async function boot() {
    applyTheme(themeMode());
    watchSystemTheme();
    setUsagi($('bootHero'), 'normal');
    setUsagi($('unconfHero'), 'normal');
    cfg = resolveConfig();
    if (!cfg) return show('unconfigured');
    if (typeof supabase === 'undefined' || !supabase.createClient) {
      $('unconfigured').querySelector('p').textContent = '没有加载到 Supabase 脚本，请检查网络后刷新页面。';
      return show('unconfigured');
    }
    sb = supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    buildEmojiPanel();
    buildPlusPanel();
    bind();
    setAuthMode('login');
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* 不支持就算了 */ });
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_OUT' && S.me) {
        setTimeout(function () { stopRealtime(); resetState(); showAuth(); }, 0); // 会话失效（比如在别处退出）
      }
    });
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) await enterApp(); else showAuth();
    fitViewport();
  }
  boot().catch(function (e) {
    console.error(e);
    show('auth');
    authMsg('启动失败，请刷新页面重试');
  });
})();
</script>
